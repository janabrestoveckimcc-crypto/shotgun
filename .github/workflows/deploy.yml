name: Build and deploy Shotgun Keyboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shotgun-pages
  cancel-in-progress: true
jobs:
  # Windows distribution is paused after antivirus blocked the generated binary.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shotgun-android-development-signing-v1
      - run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: android/app/build/outputs/apk/debug/app-debug.apk
  build:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: android-package
          path: release/android
      - name: Package downloads
        run: |
          cp release/android/app-debug.apk dist/downloads/shotgun-keyboard.apk
          cd release/extension
          zip -qr ../../dist/downloads/shotgun-keyboard-extension.zip .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
